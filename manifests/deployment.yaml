apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
  labels:
    app: demo-app
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: application

spec:
  replicas: 5
  strategy:
type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/component: application

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: demo-app
          image: hashicorp/http-echo:1.0
          imagePullPolicy: IfNotPresent

          args:
            - "-text=Hello from Production KEDA"

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          resources    :
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m 
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
