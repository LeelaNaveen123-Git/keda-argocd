apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-demo-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/LeelaNaveen123-Git/keda-argocd.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: demo-app
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true